name: Update KPI data

on:
  schedule:
    - cron: '0 23 * * *'   # 매일 08:00 KST
    - cron: '0 9 * * *'    # 매일 18:00 KST
  workflow_dispatch:        # Actions 탭에서 수동 실행

permissions:
  contents: write

concurrency:
  group: update-kpi
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: BigQuery → docs/data/kpi.json
        run: node scripts/fetch.mjs
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/kpi.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: update KPI data"
            git push
          fi
